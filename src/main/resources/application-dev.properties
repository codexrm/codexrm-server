server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5433/codexrm
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.generate-ddl=false
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# JWT
codexrm.app.jwtSecret=codexrm.app.jwtSecret=8f3a1b5c9e7d4f2a6b8c0d1e3f5a7b9c2d4e6f8a0b1c3d5e7f9a2b4c6d8e0f
codexrm.app.jwtExpirationMs=3600000
codexrm.app.jwtRefreshExpirationMs=864000000

cors.allowed-origins=http://localhost:3000