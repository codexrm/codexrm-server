name: Build and Test

on:
  push:
    branches:
      - main
      - develop
      - feature/**
      - test/**
      - docs/**
      - ci/**
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: codexrm_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.READ_PACKAGES_TOKEN }}</password>
              </server>
              <server>
                <id>github-jris</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.READ_PACKAGES_TOKEN }}</password>
              </server>
              <server>
                <id>github-eilibrary</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.READ_PACKAGES_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build and run unit tests
        run: mvn clean test

      - name: Run critical integration suite
        run: mvn failsafe:integration-test failsafe:verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/codexrm_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_PROFILES_ACTIVE: test,integration

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**