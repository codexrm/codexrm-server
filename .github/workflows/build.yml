name: Build and Test

on:
  push:
    branches:
      - main
      - develop
      - feature/**
      - test/**
      - docs/**
      - ci/**
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.READ_PACKAGES_TOKEN }}</password>
              </server>
              <server>
                <id>github-jris</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.READ_PACKAGES_TOKEN }}</password>
              </server>
              <server>
                <id>github-eilibrary</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.READ_PACKAGES_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build and run tests
        run: mvn clean test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**